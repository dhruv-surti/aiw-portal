<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Wrangler | Classroom Access</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --text: #f2f2f2;
    --muted: #9aa0a6;
    --accent: #2f6fed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--card);
    padding: 40px 32px;
    border-radius: 12px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }
  .signin-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .signin-btn:hover { opacity: 0.92; }
  .status {
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
  }
  footer {
    margin-top: 24px;
    font-size: 11px;
    color: #55595f;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>AI Wrangler Classroom Wi-Fi</h1>
    <p>Sign in with your TAFE Microsoft account to connect and mark your attendance.</p>
    <a id="signinBtn" class="signin-btn" href="#">Sign in with Microsoft</a>
    <div class="status" id="status"></div>
    <footer>Natural Velocity &middot; AI Wrangler</footer>
  </div>

  <script>
    // ---- CONFIG: fill these in once you've registered the app in Entra ID
    // and deployed the Cloudflare Worker (steps 3-4 of the guide).
    const CLIENT_ID = "YOUR_ENTRA_APP_CLIENT_ID";
    const TENANT_ID = "YOUR_ENTRA_TENANT_ID";
    const REDIRECT_URI = "https://YOUR-WORKER-SUBDOMAIN.workers.dev/callback";

    // Capture the AP MAC / client MAC UniFi passes in the query string
    // (UniFi's guest portal appends params like ap, id, t, url, ssid).
    const params = new URLSearchParams(window.location.search);
    const clientMac = params.get("id") || "";
    const apMac = params.get("ap") || "";
    const originalUrl = params.get("url") || "";

    function buildAuthUrl() {
      const base = `https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize`;
      const state = encodeURIComponent(JSON.stringify({ clientMac, apMac, originalUrl }));
      const query = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        response_mode: "query",
        scope: "openid profile email User.Read",
        state: state
      });
      return `${base}?${query.toString()}`;
    }

    document.getElementById("signinBtn").addEventListener("click", function (e) {
      e.preventDefault();
      document.getElementById("status").textContent = "Redirecting to Microsoft sign-in...";
      window.location.href = buildAuthUrl();
    });
  </script>
</body>
</html>
