<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Wrangler | Classroom Wi-Fi</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --text: #f2f2f2;
    --muted: #9aa0a6;
    --accent: #2f6fed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--card);
    padding: 40px 32px;
    border-radius: 12px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  .connect-btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .connect-btn:hover { opacity: 0.92; }
  .connect-btn:disabled { opacity: 0.6; cursor: default; }
  .status { margin-top: 18px; font-size: 13px; color: var(--muted); min-height: 18px; }
  footer { margin-top: 24px; font-size: 11px; color: #55595f; }
</style>
</head>
<body>
  <div class="card">
    <h1>AI Wrangler Classroom Wi-Fi</h1>
    <p>Tap connect to join the classroom network.</p>
    <button id="connectBtn" class="connect-btn">Connect</button>
    <div class="status" id="status"></div>
    <footer>Natural Velocity &middot; AI Wrangler</footer>
  </div>

  <script>
    // UniFi's guest portal redirects here with query params identifying
    // the client and the original destination it was trying to reach.
    // Typical params: id (client MAC), ap (AP MAC), ssid, t (timestamp),
    // url (original requested URL).
    const params = new URLSearchParams(window.location.search);

    const status = document.getElementById("status");
    const btn = document.getElementById("connectBtn");

    btn.addEventListener("click", function () {
      btn.disabled = true;
      status.textContent = "Connecting...";

      // Send the client back to their originally requested URL (or a
      // default) once authorized. On a stock UniFi click-through guest
      // portal, redirecting back through the controller's authorize
      // link releases the client; no server-side call needed.
      const originalUrl = params.get("url") || "https://www.google.com";

      setTimeout(function () {
        window.location.href = originalUrl;
      }, 600);
    });
  </script>
</body>
</html>
